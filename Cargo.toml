[package]
name = "syscore"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.6"
tokio = { version = "1", features = ["full"]}
dotenvy = "0.15"

serde = { version = "1", features = ["derive"] }
toml = "0.9"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }